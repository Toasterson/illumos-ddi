[workspace]
resolver = "3"
members = [
  "crates/ddi-sys",
  "crates/ddi",
  "examples/rnull",
  "xtask",
]
default-members = ["crates/ddi-sys", "crates/ddi", "examples/rnull"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://code.aopc.cloud/OpenIndiana/illumos-ddi"
rust-version = "1.97"

[workspace.dependencies]
ddi-sys = { path = "crates/ddi-sys" }
ddi = { path = "crates/ddi" }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
serde_json = "1"

# Kernel modules are linked by `ld -ztype=kmod`, not by rustc. Keep debug
# info for mdb/DTrace; abort on panic (the target JSON enforces it too).
[profile.release]
debug = 2
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
opt-level = 1
