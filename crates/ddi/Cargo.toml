[package]
name = "ddi"
description = "Safe Rust layer over the illumos kernel Driver Developer Interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["panic-handler"]
# Route Rust panics to panic(9F). Disable when linking into a hosted test.
panic-handler = []
# Provide a #[global_allocator] that always uses KM_SLEEP. Only for
# prototypes: it is unsound to allocate this way from interrupt context.
global-alloc-sleep = []
# The safe wrappers over the private tier (illumos-kernel-private-sys),
# checked against illumos gate cda5b9a49f and meaningful only on a kernel
# of that commit; see docs/DESIGN.md section 4. Enables ddi::private.
unstable-gate-cda5b9a49f = ["dep:illumos-kernel-private-sys", "illumos-kernel-private-sys/unstable-gate-cda5b9a49f"]

[dependencies]
ddi-sys.workspace = true
illumos-kernel-private-sys = { workspace = true, optional = true }
zerocopy.workspace = true

[package.metadata.kmod]
depends = []
