# Solstice CI (Forgejo Actions). Constraints of the runner: no `uses:`, no
# `needs:`, no `if:`, no artifacts; steps run as `sh -lc`; sccache is injected
# automatically when on PATH. The runner clones the repository at the pushed
# commit before the first step and runs every step from its root, so there is
# no checkout step. (An explicit clone from ${GITHUB_SERVER_URL} failed on
# every run until 26 September 2026, because the runner does not set it.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-hosted:
    # Ubuntu: type-check, lint, format-check and document against the hosted
    # illumos target. The image's shared rustup under /opt/rust is read-only
    # for the job user, so the toolchain pinned in rust-toolchain.toml is
    # installed into a private rustup in $HOME. Steps do not share an
    # environment, so each one sets the paths again.
    runs-on: rust
    steps:
      - run: >
          curl -sSf https://sh.rustup.rs | env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          sh -s -- -y --profile minimal --default-toolchain none --no-modify-path &&
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 &&
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo check --workspace --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo clippy --workspace --target x86_64-unknown-illumos -- -D warnings
      # The private tier and its safe wrappers exist only with the feature
      # that names their gate commit (docs/DESIGN.md section 4).
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo clippy -p ddi -p illumos-kernel-private-sys --features ddi/unstable-gate-cda5b9a49f --target x86_64-unknown-illumos -- -D warnings
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo fmt --all -- --check
      # Host unit tests and the compile_fail doctests of the type rules
      # (docs/DESIGN.md section 5.12). Without the panic handler, which
      # would clash with std's; the doctests only compile, so the illumos
      # target works on any host.
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && cargo test -p ddi --no-default-features --lib && cargo test -p ddi --no-default-features --doc --target x86_64-unknown-illumos
      # Stable rustdoc accepts a compile_fail doctest that fails for any
      # reason; only a nightly checks the error code written after it. So
      # the doctests run again on the nightly the kmod job pins, which makes
      # every type rule fail for the reason it names.
      - run: >
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 &&
          rustup toolchain install nightly-2026-04-16 --profile minimal --target x86_64-unknown-illumos &&
          cargo +nightly-2026-04-16 test -p ddi --no-default-features --doc --target x86_64-unknown-illumos
      - run: export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:$PATH" SCCACHE_STARTUP_TIMEOUT=60 && RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude xtask --no-deps --target x86_64-unknown-illumos

  kmod-illumos:
    # Native illumos: install a pinned nightly (the only nightly-only step is
    # -Zbuild-std), build rnull and rselftest for the kernel target, link
    # them with the illumos ld as real kernel modules and check them.
    runs-on: illumos
    steps:
      - run: >
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          --default-toolchain nightly-2026-04-16 --component rust-src --no-modify-path
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && export SCCACHE_STARTUP_TIMEOUT=60 &&
          cargo +nightly-2026-04-16 build -p rnull -p rselftest --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
      - run: >
          ld -ztype=kmod -z allextract
          target/x86_64-illumos-kmod/release/rnull.a -o target/rnull &&
          elfdump -d target/rnull && nm -u target/rnull
      - run: >
          ld -ztype=kmod -z allextract
          target/x86_64-illumos-kmod/release/rselftest.a -o target/rselftest &&
          elfdump -d target/rselftest | grep SUNW_KMOD
      # rselftest with the private tier (its RSELFTEST_IOC_ANONFD checks):
      # makespecvp lives in the specfs module, so the link names it.
      - run: >
          export PATH="$HOME/.cargo/bin:$PATH" && export SCCACHE_STARTUP_TIMEOUT=60 &&
          cargo +nightly-2026-04-16 build -p rselftest --features private-gate --release
          --target targets/x86_64-illumos-kmod.json
          -Zjson-target-spec -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem &&
          ld -ztype=kmod -N fs/specfs -z allextract
          target/x86_64-illumos-kmod/release/rselftest.a -o target/rselftest-private &&
          elfdump -d target/rselftest-private | grep NEEDED
