[package]
name = "rselftest"
description = "A pseudo driver that exercises the safe DDI layer inside a running kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[features]
# Also test the private tier's file descriptors (ddi::private::fd) through
# the RSELFTEST_IOC_ANONFD ioctl; needs a kernel of illumos gate cda5b9a49f.
private-gate = ["ddi/unstable-gate-cda5b9a49f"]

[dependencies]
ddi.workspace = true
zerocopy.workspace = true

[package.metadata.kmod]
class = "drv"
conf = "rselftest.conf"
depends = []
